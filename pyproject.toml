[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = true
version = "1.9.7"
classifiers = [
    "Operating System :: OS Independent",
]

[project]
name = "streamrip"
dynamic = [ "classifiers", "version" ]
description = "A fast music ripper for Qobuz"
license = "GPL-3.0-only"
readme = "README.md"
homepage = "https://github.com/leomoty/streamrip"
repository = "https://github.com/leomoty/streamrip"
include = ["streamrip/config.toml"]
packages = [
    { include = "streamrip" },
    { include = "rip" },
]
keywords = ["hi-res", "free", "music", "download"]

requires-python = ">=3.10,<4.0"

dependencies = [
"requests (>=2.25.1,<3.0.0)",
"mutagen (>=1.45.1,<2.0.0)",
"click (>=8.0.1,<9.0.0)",
"tqdm (>=4.61.1)",
"tomlkit (>=0.7.2,<=0.14.0)",
"pathvalidate (>=3.3.1)",
"simple-term-menu (>=1.2.1,<1.7.0) ; sys_platform == 'darwin|linux'",
"pick (==1.6.0) ; sys_platform == 'win32|cygwin'",
"windows-curses (>=2.2.0, <=2.4.2) ; sys_platform == 'win32|cygwin'",
"Pillow (>=12.2.0)",
"cleo (>=2.0.0, <=2.1.0)",
"appdirs (>=1.4.4)",
"aiofiles (>=25.1.0,<26.0.0)",
"aiohttp (>=3.13.5,<4.0.0)",
"aiodns (>=3.0.0, <5.0.0)",
]

[project.scripts]
rip = "rip.cli:main"

[poetry.group.dev.dependencies]
Sphinx = "^4.1.1"
autodoc = "^0.5.0"
types-click = "^7.1.2"
types-Pillow = "^8.3.1"
black = "^21.7b0"
isort = "^5.9.3"
flake8 = "^3.9.2"
setuptools = "^67.4.0"
pytest = "^6.2.5"